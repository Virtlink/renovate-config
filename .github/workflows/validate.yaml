---
name: 'Validate'

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: 'Install Nix'
        uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060  # v3.23.2

      - name: 'Validate'
        run: nix develop --command bash scripts/validate-renovate-configs.sh

      - name: 'Check flake'
        run: nix flake check --print-build-logs
