---
# NOTE: This workflow requires that GitHub Actions is allowed
#   to create and approve pull requests.
#   See: https://stackoverflow.com/a/73155199/146622
# NOTE: This workflow needs a GitHub App with the following permissions:
# - Commit statuses: Read and write
# - Contents: Read and write
# - Metadata: Read-only (required)
# - Pull requests: Read and write
# - Workflows: Read and write
# And the following Actions repository secrets:
# - APP_ID: The ID of the GitHub APP
# - APP_PRIVATE_KEY: The contents of the GitHub App's private key .pem file
name: 'Update GitHub Actions'

on:  # yamllint disable-line rule:truthy
  schedule:
    # Run at 03:17 on Saturday
    - cron: '17 3 * * 6'
  workflow_dispatch: # Allow manual triggering
  workflow_call:
    inputs:
      log-level:
        type: string
        required: true
        default: 'info'
        description: 'The log level of Renovate.'
      renovate-config-file:
        type: string
        required: true
        default: 'renovate-config.json'
        description: 'The path to the Renovate configuration file.'

jobs:
  update-actions:
    name: 'Update GitHub Actions'
    runs-on: ubuntu-latest
    steps:
      - name: 'Generate GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: 'Run Renovate'
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08  # v46.1.21
        with:
          configurationFile: ${{ inputs.renovate-config-file }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
