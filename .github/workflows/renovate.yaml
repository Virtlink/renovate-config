---
name: 'Renovate workflow'

on:  # yamllint disable-line rule:truthy
  # Resuable workflow:
  workflow_call:
    inputs:
      log-level:
        type: string
        required: false
        default: 'info'
        description: 'The log level of Renovate.'
      renovate-config-file:
        type: string
        required: false
        default: 'renovate-config.json'
        description: 'The path to the Renovate configuration file.'
    secrets:
      client-id:
        required: true
      client-private-key:
        required: true


jobs:
  renovate:
    name: 'Renovate'
    runs-on: ubuntu-latest
    steps:
      - name: 'Generate GitHub App token'
        id: app-token
        # yamllint disable rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.client-private-key }}

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 'Run Renovate'
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9  # v46.3.8
        # yamllint enable rule:line-length
        with:
          configurationFile: ${{ inputs.renovate-config-file }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: ignored
          RENOVATE_ONBOARDING: "false"
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: gradleWrapper
