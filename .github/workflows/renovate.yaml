---
name: 'Renovate workflow'

on:  # yamllint disable-line rule:truthy
  # Resuable workflow:
  workflow_call:
    inputs:
      log-level:
        type: string
        required: false
        default: 'info'
        description: 'The log level of Renovate.'
      renovate-config-file:
        type: string
        required: false
        default: 'renovate-config.json'
        description: 'The path to the Renovate configuration file.'
    secrets:
      client-id:
        required: true
      client-private-key:
        required: true
        

jobs:
  renovate:
    name: 'Renovate'
    runs-on: ubuntu-latest
    steps:
      - name: 'Generate GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.client-private-key }}

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: 'Run Renovate'
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835  # v46.2.1
        with:
          configurationFile: ${{ inputs.renovate-config-file }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: ignored
